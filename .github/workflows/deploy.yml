name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-agent-core:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        cd agent-core
        pip install -e ".[dev]"
    - name: Run tests
      run: |
        cd agent-core
        pytest
    - name: Type check
      run: |
        cd agent-core
        mypy src/

  deploy-infrastructure:
    needs: test-agent-core
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
    - name: Deploy to K8s
      run: |
        kubectl apply -f infrastructure/kubernetes/namespaces/
        kubectl apply -f infrastructure/kubernetes/core-services/