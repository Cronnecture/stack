apiVersion: v1
kind: Namespace
metadata:
  name: cronnecture-intelligence
  labels:
    cronnecture.com/managed: "true"
    cronnecture.com/component: "intelligence"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: intelligence-config
  namespace: cronnecture-intelligence
data:
  config.yaml: |
    monitoring:
      cycle_interval: 300
      decision_interval: 600
      auto_healing: false
    security:
      auto_rotation: false
      compliance_monitoring: true
    scaling:
      auto_scaling: false
      max_replicas: 1
    protected_namespaces:
      - mail
      - identity
      - kube-system
      - kube-public
      - kube-node-lease
      - cert-manager
      - platform
      - cronnecture-system
      - cronnecture-intelligence
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronnecture-intelligence
  namespace: cronnecture-intelligence
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cronnecture-intelligence
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cronnecture-intelligence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cronnecture-intelligence
subjects:
- kind: ServiceAccount
  name: cronnecture-intelligence
  namespace: cronnecture-intelligence
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronnecture-intelligence
  namespace: cronnecture-intelligence
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronnecture-intelligence
  namespace: cronnecture-intelligence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cronnecture-intelligence
subjects:
- kind: ServiceAccount
  name: cronnecture-intelligence
  namespace: cronnecture-intelligence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-manager
  namespace: cronnecture-intelligence
  labels:
    app: credential-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credential-manager
  template:
    metadata:
      labels:
        app: credential-manager
    spec:
      serviceAccountName: cronnecture-intelligence
      nodeSelector:
        kubernetes.io/hostname: cp-master-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: credential-manager
        image: cronnecture-intelligence:local
        imagePullPolicy: Never
        command: ["python", "/app/core/credential_manager.py"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/cronnecture
        env:
        - name: CRONNECTURE_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: cronnecture-master-key
              key: master-key
        - name: CREDENTIAL_NAMESPACE
          value: cronnecture-intelligence
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-system
  namespace: cronnecture-intelligence
  labels:
    app: monitoring-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-system
  template:
    metadata:
      labels:
        app: monitoring-system
    spec:
      serviceAccountName: cronnecture-intelligence
      nodeSelector:
        kubernetes.io/hostname: cp-master-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: monitoring-system
        image: cronnecture-intelligence:local
        imagePullPolicy: Never
        command: ["python", "/app/monitoring/intelligent_monitoring.py"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/cronnecture
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-manager
  namespace: cronnecture-intelligence
  labels:
    app: cloudflare-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-manager
  template:
    metadata:
      labels:
        app: cloudflare-manager
    spec:
      serviceAccountName: cronnecture-intelligence
      nodeSelector:
        kubernetes.io/hostname: cp-master-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: cloudflare-manager
        image: cronnecture-intelligence:local
        imagePullPolicy: Never
        command: ["python", "/app/integrations/edge_status.py"]
        env:
        - name: CLOUDFLARE_ENABLED
          value: "true"
        - name: CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: cloudflare
              key: account_id
              optional: true
        - name: CLOUDFLARE_ZONE_ID
          valueFrom:
            secretKeyRef:
              name: cloudflare
              key: zone_id
              optional: true
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare
              key: tunnel_token
              optional: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-orchestrator
  namespace: cronnecture-intelligence
  labels:
    app: master-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: master-orchestrator
  template:
    metadata:
      labels:
        app: master-orchestrator
    spec:
      serviceAccountName: cronnecture-intelligence
      nodeSelector:
        kubernetes.io/hostname: cp-master-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: master-orchestrator
        image: cronnecture-intelligence:local
        imagePullPolicy: Never
        command:
        - python
        - /app/master_orchestrator.py
        - --daemon
        - --config
        - /etc/cronnecture/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/cronnecture
        - name: data
          mountPath: /var/lib/cronnecture
        env:
        - name: CRONNECTURE_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: cronnecture-master-key
              key: master-key
        - name: CREDENTIAL_NAMESPACE
          value: cronnecture-intelligence
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: intelligence-config
      - name: data
        emptyDir: {}
