apiVersion: apps/v1
kind: Deployment
metadata:
  name: hanko
  namespace: identity
  labels:
    app: hanko
    cronnecture.com/managed-by: stack
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: hanko
  template:
    metadata:
      labels:
        app: hanko
    spec:
      nodeSelector:
        pool: general
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: hanko
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: migrate
        image: ghcr.io/teamhanko/hanko:v2.7.0
        args:
        - migrate
        - up
        - --config
        - /etc/config/config.yaml
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
      containers:
      - name: hanko
        image: ghcr.io/teamhanko/hanko:v2.7.0
        args:
        - serve
        - public
        - --config
        - /etc/config/config.yaml
        ports:
        - name: http
          containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/alive
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: hanko-config
---
apiVersion: v1
kind: Service
metadata:
  name: hanko
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  type: ClusterIP
  selector:
    app: hanko
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-default
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {}
  egress:
  - {}

# Authentik is on in-cluster identity-postgres (migrated off Supabase so
# gunicorn can scale without pool_size 15). Vaultwarden remains on the
# Supabase DSN pinned in identity-secrets. Logto is retired.
# scripts/sync-identity-db-secrets.py pins secrets to whatever the live
# pods actually use — do not point Vaultwarden at an empty local DB.
---
# Login frontends are 2 replicas / anti-affinity. Data PVCs stay 1.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authentik-server
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: authentik-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authentik-worker
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: authentik-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hanko
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hanko
