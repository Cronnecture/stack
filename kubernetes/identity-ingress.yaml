# HTTP for identity apps goes through Traefik. Cloudflare node-tunnel
# originates at the Traefik ClusterIP over HTTP, so force X-Forwarded-Proto
# https or Logto/Authentik advertise http:// authorization endpoints.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-forwarded
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
      X-Forwarded-Port: "443"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`vault.cronnecture.com`)
      kind: Rule
      middlewares:
        - name: https-forwarded
      services:
        - name: vaultwarden
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: passbolt
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`passbolt.cronnecture.com`)
      kind: Rule
      middlewares:
        - name: https-forwarded
      services:
        - name: passbolt
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.cronnecture.com`)
      kind: Rule
      middlewares:
        - name: https-forwarded
      services:
        - name: authentik
          port: 9000
