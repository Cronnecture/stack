# HTTP for identity apps goes through Traefik. Cloudflare node-tunnel
# originates at the Traefik ClusterIP. Do not expose these as NodePorts.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: identity
  labels:
    cronnecture.com/managed-by: stack
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`vault.cronnecture.com`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
