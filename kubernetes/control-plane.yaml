apiVersion: v1
kind: Namespace
metadata:
  name: cronnecture-system
  labels:
    cronnecture.com/component: control-plane
    cronnecture.com/managed-by: stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-core
  namespace: cronnecture-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cronnecture-agent-core
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces", "services", "configmaps", "endpoints", "persistentvolumeclaims", "secrets", "events", "resourcequotas"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: [""]
  resources: ["namespaces", "services", "configmaps", "resourcequotas"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["traefik.io"]
  resources: ["ingressroutes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cronnecture-agent-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cronnecture-agent-core
subjects:
- kind: ServiceAccount
  name: agent-core
  namespace: cronnecture-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-core
  namespace: cronnecture-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-core
  template:
    metadata:
      labels:
        app: agent-core
    spec:
      serviceAccountName: agent-core
      nodeSelector:
        kubernetes.io/hostname: cp-master-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: agent-core
        image: cronnecture-agent-core:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: cloudflare
              key: account_id
              optional: true
        - name: CLOUDFLARE_ZONE_ID
          valueFrom:
            secretKeyRef:
              name: cloudflare
              key: zone_id
              optional: true
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare
              key: readonly_token
              optional: true
        - name: CLOUDFLARE_TUNNEL_ID
          valueFrom:
            secretKeyRef:
              name: cloudflare
              key: tunnel_id
              optional: true
        - name: CLOUDFLARE_HTTP_ORIGIN
          value: "http://10.43.125.134:80"
        - name: KEEP_CLIENT_NAMESPACES
          value: "client-noorddriveautos"
        - name: PLATFORM_API
          value: "http://control-plane.platform.svc.cluster.local:8080"
        - name: OPS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-api
              key: OPS_API_TOKEN
              optional: true
        - name: BOOKS_FILES_DIR
          value: /var/lib/cronnecture/books
        - name: BOOKS_S3_PREFIX
          value: operator-books
        - name: BOOKS_S3_ENV_FILE
          value: /etc/cronnecture/backup-r2.env
        - name: BOOKS_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: operator-books-r2
              key: AWS_ACCESS_KEY_ID
              optional: true
        - name: BOOKS_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: operator-books-r2
              key: AWS_SECRET_ACCESS_KEY
              optional: true
        - name: BOOKS_S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: operator-books-r2
              key: BUCKET
              optional: true
        - name: BOOKS_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: operator-books-r2
              key: ENDPOINT
              optional: true
        - name: BOOKS_S3_REGION
          valueFrom:
            secretKeyRef:
              name: operator-books-r2
              key: AWS_DEFAULT_REGION
              optional: true
        volumeMounts:
        - name: operator-books
          mountPath: /var/lib/cronnecture/books
        - name: backup-r2-env
          mountPath: /etc/cronnecture/backup-r2.env
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: operator-books
        hostPath:
          path: /var/lib/cronnecture/books
          type: DirectoryOrCreate
      - name: backup-r2-env
        hostPath:
          path: /etc/cronnecture/backup-r2.env
          type: File
---
apiVersion: v1
kind: Service
metadata:
  name: agent-core
  namespace: cronnecture-system
spec:
  type: ClusterIP
  selector:
    app: agent-core
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: cronnecture-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      nodeSelector:
        pool: general
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - worker-general-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: dashboard
        image: cronnecture-control-portal:local
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: CONTROL_API_URL
          value: "http://agent-core.cronnecture-system.svc.cluster.local:8000"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        readinessProbe:
          httpGet:
            path: /login
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: cronnecture-system
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stack-control-plane
  namespace: cronnecture-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`control.cronnecture.com`) && PathPrefix(`/api/control`)
      kind: Rule
      priority: 30
      services:
        - name: dashboard
          port: 80
    - match: Host(`control.cronnecture.com`) && PathPrefix(`/api/fx`)
      kind: Rule
      priority: 30
      services:
        - name: dashboard
          port: 80
    - match: Host(`control.cronnecture.com`) && PathPrefix(`/api`)
      kind: Rule
      priority: 20
      services:
        - name: agent-core
          port: 8000
    - match: Host(`control.cronnecture.com`)
      kind: Rule
      priority: 10
      services:
        - name: dashboard
          port: 80
