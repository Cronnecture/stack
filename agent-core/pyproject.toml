[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cronnecture-agent"
version = "0.1.0"
description = "Agentic business automation system for Cronnecture"
authors = [
    {name = "Cronnecture Team", email = "dev@cronnecture.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "kubernetes>=28.1.0",
    "ansible>=8.0.0",
    "stripe>=7.0.0",
    "prometheus-client>=0.19.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "celery>=5.3.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/Cronnecture/agent-core"
Repository = "https://github.com/Cronnecture/agent-core.git"

[tool.hatch.build.targets.wheel]
packages = ["src/cronnecture_agent"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true