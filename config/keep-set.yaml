# Namespaces this stack must never wipe or replace.
keep:
  - mail
  - identity
  - git
  - platform
  - kube-system
  - cronnecture-system
  - client-noorddriveautos
owned_by_stack:
  mail:
    manifests:
      - kubernetes/mail.yaml
    secret: none
    # Stalwart data is hostPath /var/lib/cronnecture/stalwart on mail-01 (not a PVC).
    pvcs: []
  identity:
    manifests:
      - kubernetes/identity.yaml
      - kubernetes/identity-cerbos.yaml
      - kubernetes/identity-ingress.yaml
    secret: identity-secrets
    pvcs:
      - identity-postgres
      - identity-redis
      - vaultwarden-data
      - passbolt-mariadb
      - passbolt-data
      - passbolt-jwt
  git:
    manifests:
      - kubernetes/gitea.yaml
    secret: gitea-secrets
    pvcs:
      - gitea-postgres
      - gitea-data
protected_domains:
  - cronnecture.com
  - www.cronnecture.com
  - cronnecture.nl
  - www.cronnecture.nl
  - mail.cronnecture.com
  - webmail.cronnecture.com
  - vault.cronnecture.com
  - ops.cronnecture.com
  - client.cronnecture.com
  - passbolt.cronnecture.com
  - auth.cronnecture.com
  - git.cronnecture.com
  - stack.cronnecture.com
  - control.cronnecture.com
public_ports:
  mail:
    - 25/tcp
    - 587/tcp
  operator:
    - 22/tcp  # limited by UFW source IP
